name = "REPLACE_ME"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "REPLACE_ME"
database_id = "REPLACE_ME"

[[kv_namespaces]]
binding = "kv"
id = "REPLACE_ME"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
ai_model = "REPLACE_ME"
analysis_cache = "REPLACE_ME"
#orm_log = false
domain = "REPLACE_ME"
admin = "REPLACE_ME"
jwt_secret = "REPLACE_ME"
project_link = "REPLACE_ME"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
