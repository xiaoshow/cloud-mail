name = "REPLACE_ME"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"
database_name = "REPLACE_ME"
database_id = "REPLACE_ME"

[[kv_namespaces]]
binding = "kv"
id = "REPLACE_ME"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[vars]
ai_model = "REPLACE_ME"
analysis_cache = "REPLACE_ME"
orm_log = "REPLACE_ME"
domain = "REPLACE_ME"
admin = "REPLACE_ME"
jwt_secret = "REPLACE_ME"
