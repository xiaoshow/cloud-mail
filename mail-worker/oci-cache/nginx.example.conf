# Dedicated Codex relay. Does not log chat requests or authentication headers.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name cache.example.com;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/codex-remote-error.log warn;
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;
    client_max_body_size 64k;
    location ^~ /_mail_cache/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:18826/;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_cache off;
        access_log off;
    }
    location ^~ /buffer-media/ {
        alias /srv/buffer-media/;
        types { video/mp4 mp4; image/webp webp; image/jpeg jpg jpeg; image/png png; }
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://127.0.0.1:18791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
