name = "REPLACE_ME"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "REPLACE_ME"
database_id = "REPLACE_ME"

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "REPLACE_ME"

#(可选)
#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = "test-email"		#r2对象存储桶的名字

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存


[vars]
ai_model = "REPLACE_ME"
analysis_cache = "REPLACE_ME"
orm_log = "REPLACE_ME"
domain = "REPLACE_ME"
admin = "REPLACE_ME"
jwt_secret = "REPLACE_ME"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
